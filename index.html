<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Sabotage // Diagnostic Terminal</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --warning-color: #f85149;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .header {
            color: var(--accent-color);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .output-box {
            background-color: #010409;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--warning-color);
            padding: 16px;
            min-height: 80px;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: break-word;
            display: flex;
            align-items: center;
        }

        button {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: #2ea043;
        }

        button:active {
            background-color: #1a6327;
        }
    </style>
</head>
<body>

<div class="terminal-card">
    <div class="header">System Diagnostics // Semantic Engine v2.4</div>
    <div class="output-box" id="terminal-output">Press button to initialize telemetry readout...</div>
    <button onclick="generateSabotage()">GENERATE TELEMETRY READOUT</button>
</div>

<script src="main.js?v=2.2"></script>
    
</body>
</html>
